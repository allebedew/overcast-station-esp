<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <title>Метеостанция</title>
        <style>
            /* ============ BASE / THEME ============ */
            :root {
                --bg: #0d1117;
                --panel: #161b22;
                --panel-2: #1c2330;
                --border: #232c3b;
                --text: #e6edf3;
                --text-dim: #8b98a9;
                --text-faint: #5b6675;
                --accent: #4da3ff;
                --temp: #ff8a4c;
                --hum: #4dc3ff;
                --co2: #7ee081;
                --co2-warn: #ffd24d;
                --co2-bad: #ff6b6b;
                --press: #a78bfa;
                --lux: #ffc94d;
                --presence: #38d9c0;
                --ok: #3fb950;
                --radius: 12px;
                --font:
                    -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
                    sans-serif;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html {
                -webkit-text-size-adjust: 100%;
            }
            body {
                background: var(--bg);
                color: var(--text);
                font-family: var(--font);
                font-size: 14px;
                line-height: 1.4;
                min-height: 100vh;
                padding-bottom: env(safe-area-inset-bottom);
            }
            .wrap {
                max-width: 1080px;
                margin: 0 auto;
                padding: 12px 12px 20px;
            }

            /* ============ HEADER ============ */
            header {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: 10px;
                padding: 6px 2px 14px;
            }
            /* the three controls wrap as one block, so a narrow screen never
             * splits them across two rows */
            .hdr-title,
            .hdr-ctl {
                display: flex;
                align-items: center;
                gap: 8px;
                min-height: 34px;
            }
            .hdr-ctl {
                margin-left: auto;
            }
            /* every control in the header row is the same height, so the
             * range switch, the language switch and the gear read as one
             * strip */
            header .seg,
            header .icon-btn {
                height: 34px;
                box-sizing: border-box;
                flex: none;
            }
            header h1 {
                font-size: 16px;
                font-weight: 600;
            }
            @media (max-width: 560px) {
                .hdr-ctl {
                    width: 100%;
                    margin-left: 0;
                }
                .hdr-ctl .seg#rangeSeg {
                    flex: 1;
                }
                .hdr-ctl .seg#rangeSeg button {
                    flex: 1;
                    padding: 4px 6px;
                }
            }
            /* link state, in front of the title: green while the polling
             * keeps succeeding, red once it goes stale, blinking either way */
            .dot {
                flex: none;
                width: 11px;
                height: 11px;
                border-radius: 50%;
                background: var(--ok);
                animation: pulse 2s infinite;
            }
            @keyframes pulse {
                50% {
                    opacity: 0.45;
                }
            }
            body.stale .dot {
                background: var(--co2-bad);
            }
            body.stale .grid-sensors,
            body.stale .card.weather,
            body.stale .grid-bottom {
                opacity: 0.45;
            }

            /* ============ GRID ============ */
            /* Six cards on a six-column grid: three across, two rows. */
            .grid-sensors {
                display: grid;
                grid-template-columns: repeat(6, 1fr);
                gap: 12px;
            }
            .grid-sensors > .card {
                grid-column: span 2;
            }
            .grid-bottom {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 12px;
                margin-top: 12px;
                align-items: start;
            }
            @media (max-width: 900px) {
                .grid-sensors {
                    grid-template-columns: repeat(2, 1fr);
                }
                .grid-sensors > .card {
                    grid-column: span 1;
                }
                .grid-bottom {
                    grid-template-columns: 1fr 1fr;
                }
                .grid-bottom .card:first-child {
                    grid-column: 1 / -1;
                }
            }
            @media (max-width: 640px) {
                .grid-sensors {
                    grid-template-columns: 1fr;
                }
                .grid-bottom {
                    grid-template-columns: 1fr;
                }
                .wrap {
                    padding: 10px;
                }
            }

            /* ============ CARDS ============ */
            .card {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 14px;
            }
            .card h2 {
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--text-dim);
                display: flex;
                align-items: center;
                gap: 7px;
                margin-bottom: 10px;
            }

            /* --- Sensor card --- */
            .sensor .reading {
                display: flex;
                align-items: baseline;
                gap: 8px;
            }
            .sensor .value {
                font-size: 34px;
                font-weight: 700;
                letter-spacing: -0.02em;
                font-variant-numeric: tabular-nums;
                /* the body line-height would pad the digits with ~7px of
                   leading on both sides, which reads as a gap */
                line-height: 1.05;
            }
            .sensor .unit {
                font-size: 15px;
                color: var(--text-dim);
                font-weight: 500;
            }
            .sensor .trend {
                font-size: 12px;
                margin-left: auto;
                font-variant-numeric: tabular-nums;
            }
            .trend.up {
                color: var(--temp);
            }
            .trend.down {
                color: var(--hum);
            }
            .trend.flat {
                color: var(--text-faint);
            }
            /* Min/max ride along the right edge of the big reading instead of
               taking a row of their own — that row was stolen from the chart. */
            .sensor .minmax {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                align-self: center;
                margin-left: auto;
                gap: 1px;
                font-size: 11.5px;
                line-height: 1.25;
                color: var(--text-faint);
                font-variant-numeric: tabular-nums;
                white-space: nowrap;
            }
            .sensor .minmax b {
                color: var(--text-dim);
                font-weight: 600;
                margin-left: 4px;
            }
            /* Column so a footer can sit on the bottom edge; the grid row is as
               tall as the tallest card and the chart must not absorb that. */
            .card.sensor {
                display: flex;
                flex-direction: column;
            }
            .card.sensor h2 {
                margin-bottom: 6px;
            }
            .sensor canvas {
                width: 100%;
                height: 112px;
                flex: none;
                margin-top: 4px;
                display: block;
                touch-action: pan-y;
                cursor: crosshair;
            }
            .badge {
                font-size: 10.5px;
                white-space: nowrap;
                padding: 2px 8px;
                border-radius: 99px;
                font-weight: 600;
                margin-left: auto;
            }
            .badge.good {
                background: rgba(126, 224, 129, 0.12);
                color: var(--co2);
            }
            .badge.warn {
                background: rgba(255, 210, 77, 0.12);
                color: var(--co2-warn);
            }
            .badge.bad {
                background: rgba(255, 107, 107, 0.14);
                color: var(--co2-bad);
            }
            .badge.off {
                background: rgba(91, 102, 117, 0.18);
                color: var(--text-faint);
            }
            /* One line under the chart: a wording on the left and, on cards
               that have one, a secondary value pinned to the right edge.
               Ellipsised rather than wrapped — the card height is shared with
               every other sensor card in the grid. */
            .cardfoot {
                display: flex;
                align-items: baseline;
                gap: 6px;
                margin-top: auto;
                padding-top: 12px;
                /* into the card's own bottom padding: the line reads as part of
                   the lower edge rather than as another row of content */
                margin-bottom: -7px;
                font-size: 11.5px;
                font-weight: 600;
                color: var(--text);
                white-space: nowrap;
            }
            .cardfoot > .cf-l {
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .cardfoot > .cf-r {
                margin-left: auto;
            }
            /* label dim, value in the text colour — the same pairing the
               pressure tendency uses */
            .cf-k {
                color: var(--text-dim);
            }
            /* Bullet in the badge's colour, so the grade the arrow carries is
               repeated where the wording is. Only the graded footers have one. */
            .cardfoot::before {
                content: "•";
                /* larger than the text it marks, nudged back onto its baseline
                   (as a flex item it is baseline-aligned, not vertical-align'd) */
                font-size: 2em;
                line-height: 1;
                position: relative;
                top: 0.13em;
            }
            .cardfoot.plain::before {
                content: none;
            }
            .cardfoot.good::before {
                color: var(--co2);
            }
            .cardfoot.warn::before {
                color: var(--co2-warn);
            }
            .cardfoot.bad::before {
                color: var(--co2-bad);
            }
            .cardfoot.pending {
                color: var(--text-faint);
            }

            /* --- Outside weather card --- */
            .card.weather {
                margin-top: 12px;
            }
            .weather-age {
                margin-left: auto;
                font-size: 10.5px;
                font-weight: 500;
                color: var(--text-faint);
                text-transform: none;
                letter-spacing: 0;
            }
            .weather-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
                gap: 12px;
            }
            .weather-metric {
                display: flex;
                flex-direction: column;
                gap: 2px;
                padding: 10px 12px;
                border-radius: 10px;
                background: var(--panel-2);
                border: 1px solid var(--border);
            }
            .weather-metric .ov {
                font-size: 24px;
                font-weight: 700;
                letter-spacing: -0.02em;
                font-variant-numeric: tabular-nums;
            }
            .weather-metric .ou {
                font-size: 12px;
                color: var(--text-dim);
                font-weight: 500;
                margin-left: 3px;
            }
            .weather-metric .ol {
                font-size: 11px;
                color: var(--text-faint);
            }
            /* the conditions tile holds a phrase, not a reading: the 24px
             * numeric size would only make it wrap in a narrow column */
            .weather-metric.cond .ov {
                font-size: 15px;
                font-weight: 600;
                line-height: 1.25;
                letter-spacing: 0;
                /* the numeric tiles keep a single line; this one takes the
                 * slack of the equal-height row so its label stays at the
                 * bottom edge like theirs */
                margin-bottom: auto;
            }
            .weather-meta {
                margin-top: 12px;
                font-size: 11px;
                color: var(--text-faint);
                font-variant-numeric: tabular-nums;
                /* reserve one line so nothing below jumps when data loads */
                min-height: 1.3em;
            }
            /* The sun line carries readings, not provenance, so it reads like a
               card footer rather than like the location line above it. */
            .weather-meta.sun {
                font-size: 11.5px;
                font-weight: 600;
                color: var(--text);
            }
            /* Which series the station's own panel is plotting -- one card at
               a time, moved from here or from the knob. Sits at the right edge
               of the header, past the trend or the badge. */
            .on-panel {
                flex: none;
                display: flex;
                margin-left: 6px;
                padding: 2px 5px;
                border: 1px solid var(--border);
                border-radius: 99px;
                background: none;
                color: var(--text-faint);
                cursor: pointer;
            }
            .on-panel:hover {
                color: var(--text-dim);
                border-color: var(--text-faint);
            }
            .on-panel.active {
                background: var(--accent);
                border-color: var(--accent);
                color: var(--bg);
                cursor: default;
            }

            /* Liveness indicator in a card header, in front of the name. */
            .sens-dot {
                flex: none;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--co2);
            }
            .sens-dot.off {
                background: var(--co2-bad);
            }

            /* --- Location switcher (chips in the weather card) --- */
            .loc-bar {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin: 2px 0 14px;
            }
            .loc-chip {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 4px 11px;
                border-radius: 999px;
                border: 1px solid var(--border);
                background: var(--panel-2);
                font-size: 12px;
                cursor: pointer;
                transition:
                    border-color 0.15s,
                    color 0.15s;
            }
            .loc-chip:hover {
                border-color: var(--accent);
            }
            .loc-chip.active {
                border-color: var(--accent);
                color: var(--accent);
                font-weight: 600;
            }
            /* the chip is there to be picked, not deleted: the cross stays
             * faint until it is pointed at, and only then reads as destructive */
            .loc-chip .del {
                color: var(--text-faint);
                font-size: 10px;
                opacity: 0.6;
                transition:
                    color 0.15s,
                    opacity 0.15s;
            }
            .loc-chip .del:hover {
                color: var(--co2-bad);
                opacity: 1;
            }
            .loc-chip.add {
                color: var(--text-faint);
                font-weight: 600;
            }
            .loc-chip.dragging {
                opacity: 0.4;
            }
            .loc-chip.over {
                border-style: dashed;
                border-color: var(--accent);
            }
            /* --- Location search modal --- */
            .loc-results {
                display: flex;
                flex-direction: column;
                gap: 6px;
                max-height: 260px;
                overflow-y: auto;
                margin: 6px 0 14px;
            }
            .loc-result {
                padding: 9px 10px;
                border-radius: 9px;
                border: 1px solid var(--border);
                background: var(--panel-2);
                cursor: pointer;
                font-size: 13px;
                transition: border-color 0.15s;
            }
            .loc-result:hover {
                border-color: var(--accent);
            }
            .loc-result .sub {
                font-size: 11px;
                color: var(--text-faint);
                margin-top: 1px;
            }
            /* no subtitle under this modal's heading, unlike the Wi-Fi one */
            #locModal h3 {
                margin-bottom: 14px;
            }
            .loc-sep {
                border-top: 1px solid var(--border);
                margin: 0 0 14px;
            }
            .loc-coords {
                display: flex;
                gap: 8px;
            }
            .loc-coords input {
                flex: 1;
                min-width: 0;
            }

            /* --- Segmented switches (chart window, language) --- */
            .seg {
                display: inline-flex;
                align-items: center;
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 9px;
                padding: 3px;
                gap: 2px;
            }
            .seg button {
                border: 0;
                background: transparent;
                color: var(--text-dim);
                font: inherit;
                font-size: 12px;
                font-weight: 500;
                padding: 4px 13px;
                border-radius: 7px;
                cursor: pointer;
                transition:
                    background 0.15s,
                    color 0.15s;
                min-height: 26px;
            }
            .seg button.active {
                background: var(--accent);
                color: #fff;
            }
            .seg button:not(.active):hover {
                color: var(--text);
            }
            .seg.lang button {
                padding: 4px 9px;
                min-height: 26px;
                font-size: 11px;
            }
            .icon-btn {
                width: 34px;
                height: 34px;
                border-radius: 9px;
                border: 1px solid var(--border);
                background: var(--panel);
                color: var(--text-dim);
                cursor: pointer;
                /* inline-flex + explicit padding: Safari does not centre the
                 * content of a grid/flex <button> reliably */
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 0;
                line-height: 0;
                transition:
                    border-color 0.15s,
                    background 0.15s,
                    color 0.15s;
            }
            .icon-btn svg {
                display: block;
            }
            .icon-btn:hover {
                border-color: var(--accent);
                color: var(--text);
            }
            .icon-btn.active {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }
            body:not(.show-panels) .grid-bottom {
                display: none;
            }

            /* --- Key/value table --- */
            .kv {
                width: 100%;
                border-collapse: collapse;
            }
            .kv td {
                padding: 6px 0;
                font-size: 13px;
                border-bottom: 1px solid var(--border);
            }
            .kv tr:last-child td {
                border-bottom: 0;
            }
            .kv td:first-child {
                color: var(--text-dim);
                white-space: nowrap;
                padding-right: 12px;
            }
            .kv td:last-child {
                text-align: right;
                font-variant-numeric: tabular-nums;
                overflow-wrap: anywhere;
            }
            .kv tr.kv-h td {
                padding: 14px 0 4px;
                text-align: left;
                font-size: 11px;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--text-dim);
            }
            .kv tr.kv-h:first-child td {
                padding-top: 0;
            }
            .bar-mini {
                display: inline-block;
                width: 70px;
                height: 5px;
                border-radius: 3px;
                background: var(--panel-2);
                vertical-align: middle;
                margin-right: 8px;
                overflow: hidden;
            }
            .bar-mini i {
                display: block;
                height: 100%;
                background: var(--accent);
                border-radius: 3px;
            }

            /* --- WiFi --- */
            .btn {
                border: 1px solid var(--border);
                background: var(--panel-2);
                color: var(--text);
                font: inherit;
                font-size: 13px;
                font-weight: 500;
                padding: 9px 14px;
                border-radius: 9px;
                cursor: pointer;
                transition:
                    background 0.15s,
                    border-color 0.15s;
                min-height: 38px;
            }
            .btn:hover {
                border-color: var(--accent);
            }
            .btn.primary {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }
            .btn.primary:hover {
                filter: brightness(1.1);
            }
            .btn.block {
                width: 100%;
            }
            .btn:disabled {
                opacity: 0.5;
                cursor: default;
            }
            .wifi-list {
                margin-top: 10px;
                display: flex;
                flex-direction: column;
                gap: 6px;
                max-height: 240px;
                overflow-y: auto;
            }
            .wifi-item {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 9px 10px;
                border-radius: 9px;
                border: 1px solid var(--border);
                background: var(--panel-2);
                cursor: pointer;
                transition: border-color 0.15s;
            }
            .wifi-item:hover {
                border-color: var(--accent);
            }
            .wifi-item.current {
                border-color: var(--ok);
            }
            .wifi-item .wifi-text {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 1px;
            }
            .wifi-item .ssid {
                font-size: 13px;
                font-weight: 500;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .wifi-item .bssid {
                font-size: 10px;
                color: var(--text-faint);
                font-family: ui-monospace, monospace;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .m-check {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
                color: var(--text-faint);
                margin: 2px 0 16px;
                cursor: pointer;
            }
            .m-check input {
                width: auto;
                margin: 0;
                cursor: pointer;
            }
            .wifi-item .ssid-line {
                display: flex;
                align-items: center;
                gap: 6px;
                min-width: 0;
            }
            .wbadge {
                flex: none;
                font-size: 9px;
                font-weight: 600;
                line-height: 1.5;
                padding: 0 5px;
                border-radius: 6px;
                border: 1px solid var(--border);
                color: var(--text-faint);
            }
            .wbadge.conn {
                border-color: var(--ok);
                color: var(--ok);
            }
            .rssi.off {
                opacity: 0.3;
            }
            .wifi-item .meta {
                font-size: 11px;
                color: var(--text-faint);
            }
            .wifi-item .lock {
                font-size: 11px;
            }
            /* the row is there to be joined, not forgotten: the cross stays
             * faint until it is pointed at, and only then reads as destructive */
            .wifi-item .del {
                font-size: 11px;
                color: var(--text-faint);
                opacity: 0.6;
                padding: 0 4px;
                transition:
                    color 0.15s,
                    opacity 0.15s;
            }
            .wifi-item .del:hover {
                color: var(--co2-bad);
                opacity: 1;
            }
            .rssi {
                display: inline-flex;
                align-items: flex-end;
                gap: 2px;
                height: 14px;
                flex: none;
            }
            .rssi i {
                width: 3px;
                border-radius: 1px;
                background: var(--text-faint);
            }
            .rssi i:nth-child(1) {
                height: 4px;
            }
            .rssi i:nth-child(2) {
                height: 7px;
            }
            .rssi i:nth-child(3) {
                height: 10px;
            }
            .rssi i:nth-child(4) {
                height: 13px;
            }
            .rssi[data-l="1"] i:nth-child(-n + 1),
            .rssi[data-l="2"] i:nth-child(-n + 2),
            .rssi[data-l="3"] i:nth-child(-n + 3),
            .rssi[data-l="4"] i:nth-child(-n + 4) {
                background: var(--accent);
            }
            .scan-hint {
                font-size: 12px;
                color: var(--text-faint);
                text-align: center;
                padding: 12px 0 4px;
            }
            .saved-head {
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--text-dim);
                margin: 14px 0 4px;
            }
            .spin {
                display: inline-block;
                width: 13px;
                height: 13px;
                border: 2px solid var(--text-faint);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: rot 0.7s linear infinite;
                vertical-align: -2px;
                margin-right: 6px;
            }
            @keyframes rot {
                to {
                    transform: rotate(360deg);
                }
            }

            /* --- Settings --- */
            .set-row {
                padding: 9px 0;
                border-bottom: 1px solid var(--border);
            }
            .set-row:last-child {
                border-bottom: 0;
            }
            .set-row .head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
            }
            .set-row .name {
                font-size: 13px;
            }
            .set-row .val {
                font-size: 12px;
                color: var(--text-dim);
                font-variant-numeric: tabular-nums;
            }
            .set-row .head input[type="checkbox"] {
                width: 16px;
                height: 16px;
                accent-color: var(--accent);
                cursor: pointer;
                flex: none;
            }
            .set-row .hint {
                font-size: 11px;
                line-height: 1.4;
                color: var(--text-dim);
                margin-top: 6px;
            }
            input[type="range"] {
                -webkit-appearance: none;
                width: 100%;
                height: 5px;
                border-radius: 3px;
                background: var(--panel-2);
                outline: none;
                margin-top: 10px;
            }
            input[type="range"]::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: var(--accent);
                cursor: pointer;
                border: 3px solid var(--bg);
            }
            .frc-row {
                display: flex;
                gap: 8px;
                margin-top: 10px;
            }
            .frc-row input,
            .frc-row select {
                flex: 1;
                min-width: 0;
                background: var(--panel-2);
                border: 1px solid var(--border);
                border-radius: 9px;
                color: var(--text);
                font: inherit;
                padding: 9px 12px;
            }
            .frc-row input:focus,
            .frc-row select:focus {
                outline: none;
                border-color: var(--accent);
            }

            /* --- Modal --- */
            .overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.6);
                backdrop-filter: blur(3px);
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 50;
                padding: 16px;
            }
            .overlay.show {
                display: flex;
            }
            .modal {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 14px;
                width: 100%;
                max-width: 360px;
                padding: 18px;
            }
            .modal h3 {
                font-size: 15px;
                margin-bottom: 4px;
                overflow-wrap: anywhere;
            }
            .modal .m-sub {
                font-size: 12px;
                color: var(--text-dim);
                margin-bottom: 14px;
            }
            .modal input[type="password"],
            .modal input[type="number"],
            .modal input[type="text"] {
                width: 100%;
                background: var(--panel-2);
                border: 1px solid var(--border);
                border-radius: 9px;
                color: var(--text);
                font: inherit;
                padding: 10px 12px;
                margin-bottom: 12px;
            }
            .modal input:focus {
                outline: none;
                border-color: var(--accent);
            }
            .modal .row {
                display: flex;
                gap: 8px;
            }
            .modal .row .btn {
                flex: 1;
            }

            /* --- Toast --- */
            #toast {
                position: fixed;
                left: 50%;
                bottom: 24px;
                transform: translateX(-50%) translateY(80px);
                background: var(--panel-2);
                border: 1px solid var(--border);
                color: var(--text);
                padding: 10px 18px;
                border-radius: 10px;
                font-size: 13px;
                z-index: 60;
                transition: transform 0.25s;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
                max-width: 90vw;
            }
            #toast.show {
                transform: translateX(-50%) translateY(0);
            }

            /* Keyboard focus, for the list rows that are divs acting as
               buttons as much as for the real ones */
            [role="button"]:focus-visible,
            .btn:focus-visible,
            .seg button:focus-visible,
            .icon-btn:focus-visible,
            input:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }

            /* --- Chart tooltip --- */
            #tip {
                position: fixed;
                display: none;
                z-index: 70;
                pointer-events: none;
                background: var(--panel-2);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 6px 10px;
                font-size: 12px;
                line-height: 1.35;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
                font-variant-numeric: tabular-nums;
                white-space: nowrap;
            }
            #tip b {
                display: block;
            }
            #tip span {
                display: block;
                color: var(--text-dim);
                font-size: 11px;
            }

        </style>
    </head>
    <body>
        <div class="wrap">
            <!-- HEADER -->
            <header>

                                  objects: sta, ap, climate, sensors, weather, system,
                                  settings. `climate` is the room (one source per
                                  quantity, null where there is none, plus press_msl
                                  reduced from the configured altitude), `sensors` the
                                  chips on the bus

                                  ?p=5m|1h|1d, null = gap in that series alone.
                                  press[] arrives already reduced to sea level
                                  (stored absolute, reduced on the way out)
     POST /api/history/reset    - wipes all tiers (RAM + flash snapshots)
     GET  /api/scan             - [{ssid, bssid, ch, rssi, auth}] (one per BSSID)
     GET  /api/networks         - saved networks [{ssid, bssid?}] (bssid = pinned AP)
     POST /api/networks         - add {ssid, password, bssid?} (bssid pins the AP)
     DELETE /api/networks       - {ssid}
     GET  /api/locations        - {active, locations:[{name, lat, lon}]}
     POST /api/locations        - add {name, lat, lon} (coords resolved in-browser)
     DELETE /api/locations      - {index}
     PUT  /api/locations/active - {index} (switch the displayed location)
     POST /api/connect          - restart the STA connection cycle
     POST /api/settings         - any subset of the keys /api/status reports
                                  under "settings"; an unknown key or a wrong
                                  type is a 400. wind_unit, chart_quantity and
                                  chart_range are carried as words, and the
                                  error lists the ones a key accepts
     POST /api/scd40/calibrate  - {ppm}

                document.documentElement.lang = lang;
                document.title = t("appName");

                    .querySelectorAll("[data-i18n]")
                    .forEach((el) => (el.textContent = t(el.dataset.i18n)));

                    .forEach((el) => (el.placeholder = t(el.dataset.i18nPh)));

                    .forEach((b) =>
                        b.classList.toggle("active", b.dataset.l === lang),
                    );
                setStale(document.body.classList.contains("stale"));
                renderCharts();
            }

                const btn = e.target.closest("button");
                if (!btn || btn.dataset.l === lang) return;
                lang = btn.dataset.l;
                localStorage.setItem("lang", lang);
                applyLang();
                loadNets(); /* re-render list hints and delete tooltips */
                renderLocBar(); /* refresh chip tooltips for the new language */
                /* Anything whose text comes from the poll rather than from a
                 * data-i18n attribute — the CO2 badge, the weather conditions,
                 * the system table — is re-rendered from the last reply, so
                 * nothing keeps the previous language until the next second. */
                if (lastStatus) renderStatus(lastStatus);
            });

            /* ---------- collapsible system panels (hidden by default) ---------- */
            let panelsShown = localStorage.getItem("panels") === "1";
            function applyPanels() {
                document.body.classList.toggle("show-panels", panelsShown);
                $("panelsBtn").classList.toggle("active", panelsShown);
            }
            $("panelsBtn").addEventListener("click", () => {
                panelsShown = !panelsShown;
                localStorage.setItem("panels", panelsShown ? "1" : "0");
                applyPanels();
            });
            applyPanels();

            function esc(s) {
                return String(s).replace(
                    /[&<>"']/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                            "'": "&#39;",
                        })[c],
                );
            }

            /* The lists are built from divs, so the button semantics a mouse
             * gets for free have to be spelled out for the keyboard. */
            function clickable(el, fn) {
                el.tabIndex = 0;
                el.setAttribute("role", "button");
                el.style.cursor = "pointer";
                el.addEventListener("click", fn);
                el.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        fn(e);
                    }
                });
            }

            function fmtUptime(s) {
                const d = Math.floor(s / 86400),
                    h = Math.floor((s % 86400) / 3600),
                    m = Math.floor((s % 3600) / 60),
                    sec = s % 60;
                if (d) return `${d}${t("uD")} ${h}${t("uH")} ${m}${t("uM")}`;
                if (h) return `${h}${t("uH")} ${m}${t("uM")} ${sec}${t("uS")}`;
                return `${m}${t("uM")} ${sec}${t("uS")}`;
            }

            const fmtKib = (b) => (b / 1024).toFixed(0) + " " + t("kb");

            /* The panel is rated in hours, so its wear reads in hours whatever
               it comes to — days would have to be converted back to compare. */
            const fmtHours = (s) => Math.floor(s / 3600) + " " + t("uH");

            /* Datasheet lifetime to half brightness, hours. The share spent is
               taken from the weighted seconds, the only one of the two counters
               that is on the same scale as the rating. */
            const OLED_LIFE_H = 50000;
            const fmtOledPct = (s) =>
                ((s / 3600 / OLED_LIFE_H) * 100).toFixed(1) + " %";

            /* Compact "time ago" for the outside-weather freshness stamp. */
            function fmtAgo(s) {
                const m = Math.floor(s / 60),
                    h = Math.floor(m / 60);
                if (h) return `${h} ${t("uH")}`;
                return `${Math.max(1, m)} ${t("uM")}`;
            }

            /* Unix UTC + the location's offset → "HH:MM" where the sun rises,
             * which is not necessarily where the browser is. */
            function fmtClock(unix, off) {
                const d = new Date((unix + off) * 1000);
                return (
                    String(d.getUTCHours()).padStart(2, "0") +
                    ":" +
                    String(d.getUTCMinutes()).padStart(2, "0")
                );
            }

            /* Seconds → "15h 34m". Under an hour the hours go, not shown as a
             * zero: a winter day near the arctic circle lasts minutes. */
            function fmtSpan(s) {
                const h = Math.floor(s / 3600),
                    m = Math.floor(s / 60) % 60;
                return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m`;
            }

            /* Wind speed units, keyed by the name `wind_unit` carries on the
             * API (WEATHER_WIND_UNIT_NAMES in the firmware, and the option
             * values of the picker). Readings arrive in km/h whatever the
             * setting says. */
            const WIND_UNITS = {
                kmh: { i18n: "uKmh", k: 1 },
                ms: { i18n: "uMps", k: 1 / 3.6 },
                mph: { i18n: "uMph", k: 1 / 1.609344 },
                kn: { i18n: "uKn", k: 1 / 1.852 },
            };
            let windUnit = WIND_UNITS.kmh;

            function wind(kmh) {
                return kmh * windUnit.k;
            }

            /* Meteorological degrees → one localized letter, so the tile keeps
             * the direction to a single glyph: 4 points, ±45° each. */
            function windDir(deg) {
                return t("compass")[Math.round(deg / 90) % 4];
            }

            /* UTC offset in seconds → "UTC+2" / "UTC+5.5" / "UTC-3". */
            function fmtUtc(sec) {
                const h = Math.abs(sec) / 3600;
                return (
                    "UTC" +
                    (sec < 0 ? "-" : "+") +
                    (Number.isInteger(h) ? h : h.toFixed(1))
                );
            }

            /* Rows go in as plain values and are escaped here, once, so no
             * caller has to remember which of them the device controls. */
            function kvRows(rows) {
                return rows
                    .map((r) =>
                        r.h !== undefined
                            ? `<tr class="kv-h"><td colspan="2">${esc(r.h)}</td></tr>`
                            : `<tr><td>${esc(r[0])}</td><td>${esc(txt(r[1]))}</td></tr>`,
                    )
                    .join("");
            }

            /* ---------- outside weather card ----------
             * One tile per parameter, in the order they are listed. The grid
             * is built once at startup and every tile stays in place for the
             * life of the page: an absent reading only changes the text to
             * NA, never the set of tiles. `u` is a literal unit, `ui` an i18n
             * key, `uf` derives the unit from the values themselves. `k` names
             * the tile and its DOM ids; the readings behind it are `src`, one
             * field or several where a tile merges readings that are only ever
             * read together — `f`, `uf` and `lf` then take them in that order,
             * and a tile whose readings are not all there goes to NA as a
             * whole. A merged tile stays the size of every other one by
             * putting its second reading in the label: `lf` writes it there,
             * over the static `l`, which is left as the wording to fall back
             * on before the first reply. */
            const WEATHER_TILES = [
                { k: "temp", l: "temperature", u: "°C", f: (v) => v.toFixed(1) },
                { k: "feels", l: "weatherFeels", u: "°C", f: (v) => v.toFixed(1) },
                { k: "tmax", l: "weatherTmax", u: "°C", f: (v) => v.toFixed(1) },
                { k: "tmin", l: "weatherTmin", u: "°C", f: (v) => v.toFixed(1) },
                { k: "hum", l: "humidity", u: "%", f: (v) => v.toFixed(0) },
                {
                    k: "press",
                    l: "weatherSurface",
                    src: ["press_msl", "press"],
                    u: "hPa",
                    f: (msl) => msl.toFixed(1),
                    lf: (msl, p) => `${t("weatherSurface")}: ${p.toFixed(1)}`,
                },
                { k: "uvi", l: "weatherUvi", f: (v) => v.toFixed(2) },
                {
                    k: "wind",
                    l: "weatherGust",
                    src: ["wind", "gust", "wind_dir"],
                    uf: () => t(windUnit.i18n),
                    /* the value is the speed alone, so it lines up with every
                     * other tile; the direction joins the gusts in the label */
                    f: (w) => wind(w).toFixed(1),
                    lf: (w, g, dir) =>
                        `${windDir(dir)} · ${t("weatherGust")}: ${wind(g).toFixed(1)}`,
                },
                { k: "clouds", l: "weatherClouds", u: "%", f: (v) => v.toFixed(0) },
                {
                    k: "precip_rate",
                    l: "weatherPrecip",
                    ui: "uMmh",
                    f: (v) => v.toFixed(1),
                },
            ];

            function buildWeatherGrid() {
                /* the decoded conditions lead the grid as a tile of their own:
                 * text where the others carry numbers, so it gets its own
                 * smaller, wrapping value style */
                const cond =
                    '<div class="weather-metric cond">' +
                    `<span class="ov" id="weatherCond">${NA}</span>` +
                    '<span class="ol" id="weatherCondLabel" ' +
                    'data-i18n="weatherCondLabel"></span></div>';
                $("weatherGrid").innerHTML = cond + WEATHER_TILES.map((m) => {
                    const unit = m.uf
                        ? `<span class="ou" id="wxu_${m.k}"></span>`
                        : m.ui
                          ? `<span class="ou" data-i18n="${m.ui}"></span>`
                          : m.u
                            ? `<span class="ou">${m.u}</span>`
                            : "";
                    /* a merged tile writes its own label, so it needs an id;
                     * data-i18n stays for the wording shown until then */
                    const id = m.lf ? ` id="wxl_${m.k}"` : "";
                    return (
                        '<div class="weather-metric"><div>' +
                        `<span class="ov" id="wx_${m.k}">${NA}</span>${unit}` +
                        `</div><span class="ol"${id} data-i18n="${m.l}">` +
                        "</span></div>"
                    );
                }).join("");
            }

            function renderWeather(w) {
                /* Two nullable halves: the saved place and the reading fetched
                 * for it. An empty stand-in makes every field read as absent. */
                const c = w.current || {};
                const l = w.loc || {};
                const live = (v) =>
                    typeof v === "number" && Number.isFinite(v) ? v : null;
                WEATHER_TILES.forEach((m) => {
                    const vals = (m.src || [m.k]).map((k) => live(c[k]));
                    const have = vals.every((v) => v !== null);
                    $("wx_" + m.k).textContent = have ? m.f(...vals) : NA;
                    if (m.uf)
                        $("wxu_" + m.k).textContent = have ? m.uf(...vals) : "";
                    if (m.lf)
                        $("wxl_" + m.k).textContent = have
                            ? m.lf(...vals)
                            : t(m.l);
                });

                /* the phrase is the reading; the bare WMO number goes to the
                 * label, where it documents the phrase without competing
                 * with it */
                const code = live(c.code);
                const wtext = code === null ? "" : t("wcode")[code] || "";
                $("weatherCond").textContent =
                    wtext || (code !== null && code >= 0 ? String(code) : "—");
                $("weatherCondLabel").textContent =
                    code !== null && code >= 0
                        ? `${t("weatherCondCode")}: ${code}`
                        : t("weatherCondLabel");

                /* The coordinates and the zone describe the stored location,
                 * so they outlive the reading; the elevation comes from the
                 * reply and goes with it. */
                const coord = (v) => v.toFixed(2);
                $("weatherMeta").textContent =
                    `${t("weatherAlt")} ${num(live(c.elev), Math.round)} ` +
                    `${t("uMeters")} · lat ${num(l.lat, coord)}` +
                    `, lon ${num(l.lon, coord)}` +
                    ` · ${num(l.utc_offset, fmtUtc)}`;

                const age = live(c.age);
                $("weatherAge").textContent = !w.current
                    ? t("weatherWait")
                    : age !== null && age >= 0
                      ? t("weatherAgo").replace("{n}", fmtAgo(age))
                      : "";
            }

            /*   Sun: ↑05:25 · ↓20:59 · 15h 34m · +32.4° · ↓ in 8h 32m
             * One line, not tiles: four related facts about the day rather than
             * four readings. Only the two clock times need the offset. */
            /* Kept in step with sun_phase_str() — the API sends the band, the
             * page only names it. */
            const SUN_PHASE = {
                day: "sunDay",
                golden: "sunGolden",
                civil: "sunCivil",
                nautical: "sunNautical",
                astro: "sunAstro",
                night: "sunNight",
            };

            function renderSun(s, loc) {
                const el = $("sunMeta");
                if (!s) {
                    el.textContent = "—";
                    return;
                }
                const off = loc.utc_offset;
                const clock = (v) =>
                    typeof off === "number" ? fmtClock(v, off) : NA;
                const angle = num(
                    s.elev,
                    (v) => `${v > 0 ? "+" : ""}${v.toFixed(1)}°`,
                );
                /* Named for the device's own elevation, so the wording and the
                 * angle beside it can never disagree. */
                const phase = SUN_PHASE[s.phase] ? ` · ${t(SUN_PHASE[s.phase])}` : "";
                /* Counted by the device against its synced clock, so it is not
                 * at the mercy of the browser's. */
                const next =
                    typeof s.next_in === "number"
                        ? ` · ${s.next_is_rise ? "↑" : "↓"} in ${fmtSpan(s.next_in)}`
                        : "";
                el.innerHTML =
                    '<span class="cf-k">Sun:</span> ' +
                    esc(s.state === "rises"
                        ? `↑${clock(s.rise)} · ↓${clock(s.set)} · ` +
                          `${fmtSpan(s.day_len)} · ${angle}${phase}${next}`
                        : `${t(
                              s.state === "polar_day" ? "sunPolarDay" : "sunPolarNight",
                          )} · ${angle}${phase}`);
            }

            /* ---------- toast ---------- */
            let toastTimer;
            function toast(msg) {
                const el = $("toast"); /* not `t` — that is the translator */
                el.textContent = msg;
                el.classList.add("show");
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
            }

            /* ---------- CO2 level ---------- */
            /* One tenth of a lux, at any level — the reading resolution the
             * whole firmware agrees on. Abbreviating daylight to "50k" would
             * make the same value read differently here and in the API. */
            const fmtLux = (v) => v.toFixed(1);

            function co2Level(ppm) {
                if (ppm < 1000)
                    return {
                        cls: "good",
                        text: t("co2Good"),
                        color: css("--co2"),
                    };
                if (ppm < 1500)
                    return {
                        cls: "warn",
                        text: t("co2Warn"),
                        color: css("--co2-warn"),
                    };
                return {
                    cls: "bad",
                    text: t("co2Bad"),
                    color: css("--co2-bad"),
                };
            }

            /* The barometric tendency as the pressure card's badge. The arrow
               carries the grade the device assigned: one head slow, two fast,
               three rapid, a dash for steady. */
            function trendBadge(f) {
                if (!f) return null;
                const n = Math.abs(f.trend);
                const d = Math.abs(f.delta_3h).toFixed(1);
                return {
                    cls: n >= 3 ? "bad" : n >= 2 ? "warn" : "good",
                    text: n
                        ? `${(f.trend > 0 ? "↑" : "↓").repeat(n)} ${d} hPa ${t("per3h")}`
                        : `→ ${d} hPa ${t("per3h")}`,
                };
            }

            /* ---------- status polling ---------- */
            let lastOk = null;
            let lastStatus = null;
            let polling = false;
            const STALE_AFTER_MS = 1500; /* no successful poll this long → offline */
            const POLL_TIMEOUT_MS = 1200; /* give up on a single stuck request */

            function setStale(stale) {
                document.body.classList.toggle("stale", stale);
                /* the dot carries the state; the wording only shows on hover */
                $("connDot").title = t(stale ? "noLink" : "online");
            }

            /* Fetching and rendering are kept apart on purpose: only a failed
             * request means "no link". A bug in the rendering below used to
             * land in the same catch and put the page offline with nothing in
             * the console to say why. */
            async function refresh() {
                if (polling) return; /* don't stack requests while one is stuck */
                polling = true;
                const ctrl = new AbortController();
                const to = setTimeout(() => ctrl.abort(), POLL_TIMEOUT_MS);
                let s = null;
                try {
                    const r = await fetch("/api/status", {
                        signal: ctrl.signal,
                        cache: "no-store",
                    });
                    if (!r.ok) throw new Error(r.status);
                    s = await r.json();
                } catch (e) {
                    setStale(true);
                    return;
                } finally {
                    clearTimeout(to);
                    polling = false;
                }
                lastStatus = s;
                lastOk = Date.now();
                setStale(false);
                try {
                    renderStatus(s);
                } catch (e) {
                    console.error("render", e);
                }
            }

            /* Also called on a language switch, with the last reply, so the
             * text that does not come from data-i18n follows along. */
            function renderStatus(s) {
                const sn = s.sensors || {};
                const sy = s.system || {};
                const st = s.settings || {};

                /* Main cards read the climate object, not the individual
                 * devices: one source per quantity, the same one the
                 * history is recorded from, so a card and the chart under
                 * it can never disagree. */
                const cl = s.climate || {};
                SERIES.forEach((sr) => {
                    $(sr.k + "Val").textContent = num(cl[sr.src], sr.fmt);
                    setDot(sr.k + "Dot", !!(sn[sr.dev] || {}).ok);
                });

                renderPresence(sn.pir);

                /* Cards whose badge replaces the window trend arrow: the CO₂
                 * level and the pressure tendency. The callback returns
                 * {cls, text}, or null while the value is missing. */
                SERIES.filter((sr) => sr.badge).forEach((sr) => {
                    const b = $(sr.k + "Badge");
                    const info = sr.badge(cl, s);
                    b.className = "badge " + (info ? info.cls : "off");
                    b.textContent = info ? info.text : t("noData");
                });
                /* The footer waits for its value dimmed, then reads as text on
                 * the left and an optional second value on the right edge. A
                 * graded footer is bulleted in the badge's colour; the rest ask
                 * for `plain` and carry no bullet. */
                SERIES.filter((sr) => sr.footer).forEach((sr) => {
                    const info = sr.footer(cl, s) || { cls: "pending", html: NA };
                    const el = $(sr.k + "Foot");
                    el.className = "cardfoot " + info.cls;
                    el.children[0].innerHTML = info.html;
                    el.children[1].innerHTML = info.right || "";
                });

                /* Ahead of the tiles: the unit is a setting, and the wind tile
                 * formats itself with it. */
                windUnit = WIND_UNITS[st.wind_unit] || WIND_UNITS.kmh;

                renderWeather(s.weather || {});
                renderSun(s.sun, (s.weather && s.weather.loc) || {});

                /* system card: Wi-Fi station and access point shown as
                 * separate sections (in APSTA both can be up at once). The
                 * station section always lists the same rows, an unconnected
                 * one filled with NA, so the panel keeps its shape; the AP
                 * collapses to its state row when it is down. */
                const sta = s.sta || {};
                const ap = s.ap || {};
                const wg = s.wg || {};
                const on = (cond, v) => (cond ? v : NA);
                const rows = [
                    { h: t("wifiSta") },
                    [t("state"), sta.connected ? t("staOn") : t("notConn")],
                    [t("wifiNet"), on(sta.connected, sta.ssid)],
                    [
                        t("signal"),
                        on(
                            sta.connected,
                            `${sta.rssi} dBm (ch ${sta.channel})`,
                        ),
                    ],
                    [t("phy"), on(sta.connected, sta.phy)],
                    [t("ipAddr"), on(sta.connected, sta.ip)],
                    ["MAC", on(sta.connected, sta.mac)],
                    { h: t("apMode") },
                    [t("state"), ap.active ? t("apOn") : t("apOff")],
                ];
                /* an AP that is down has nothing to describe — the state row
                 * says it, the rest would only be a column of NA */
                if (ap.active) {
                    rows.push(
                        [t("network"), ap.ssid],
                        [t("ipAddr"), ap.ip],
                        [t("channel"), ap.channel],
                        ["MAC", ap.mac],
                        [t("clients"), (ap.clients || []).length],
                    );
                    (ap.clients || []).forEach((c, i) =>
                        rows.push([
                            `${t("client")} ${i + 1}`,
                            `${c.mac} · ${c.rssi} dBm`,
                        ]),
                    );
                }
                /* the tunnel, like the AP, describes itself only when it is
                 * there: a firmware built without keys has nothing to show */
                if (wg.configured) {
                    rows.push(
                        { h: "WireGuard" },
                        [t("state"), wg.up ? t("wgUp") : t("wgDown")],
                        [t("ipAddr"), wg.ip],
                        [t("wgServer"), wg.endpoint],
                    );
                }
                rows.push(
                    { h: t("device") },
                    [
                        t("chip"),
                        `ESP32-C6 ${txt(sy.chip_rev)} ${txt(sy.cpu_mhz)} ${t("mhz")}`,
                    ],
                    [t("cpuLoad"), num(sy.cpu_load, (v) => v + "%")],
                    [
                        t("heapMem"),
                        `${num(sy.heap_free, fmtKib)} / ${num(sy.heap_total, fmtKib)}`,
                    ],
                    [
                        t("heapMin"),
                        `${num(sy.heap_min, fmtKib)} / ${num(sy.heap_largest, fmtKib)}`,
                    ],
                    [
                        t("chipTemp"),
                        num(sy.chip_temp, (v) => v.toFixed(1) + " °C"),
                    ],
                    [t("tasksConns"), `${txt(sy.tasks)}/${txt(sy.http_conns)}`],
                    ["NVS", `${txt(sy.nvs_used)}/${txt(sy.nvs_total)}`],
                    [t("uptime"), num(sy.uptime, fmtUptime)],
                    [
                        t("oledHours"),
                        sy.panel
                            ? `${fmtHours(sy.panel.on_s)} · ${fmtHours(sy.panel.dose_s)} ${t("oledEquiv")} · ${fmtOledPct(sy.panel.dose_s)}`
                            : NA,
                    ],
                    [t("resetReason"), sy.reset_reason],
                    [t("timeUtc"), sy.time],
                    [
                        t("firmware"),
                        `${txt(sy.app_version)}, ${txt(sy.build)}, idf: ${txt(sy.idf_ver)}`,
                    ],
                );
                $("sysRows").innerHTML = kvRows(rows);

                /* Settings follow the device on every poll rather than being
                   seeded once: the panel's two also answer to the knob, and a
                   page that never looks again would show them wrong. A control
                   the user is on has the focus, and that is the one case the
                   sync skips, so nothing is rewritten under a moving hand. */
                syncSetting("briRange", st.led_brightness, "briVal");
                syncSetting("volRange", st.buzzer_volume, "volVal");
                syncSetting("dispBriRange", st.display_brightness, "dispBriVal");
                syncSetting("dispOn", st.display_on);
                syncSetting("dispAutoBri", st.display_auto_brightness);
                syncSetting("altInput", st.altitude);
                syncSetting("windUnitSel", st.wind_unit);
                adopt("chart_range", st.chart_range, setRange);
                adopt("chart_quantity", st.chart_quantity, setQuantity);
            }

            /* One setting into its control: a checkbox takes `checked`,
               everything else `value`, and `valId` is the number shown beside a
               slider. */
            function syncSetting(id, value, valId) {
                if (value === undefined) return;
                const el = $(id);
                if (el === document.activeElement) return;
                if (el.type === "checkbox") el.checked = !!value;
                else el.value = value;
                if (valId) $(valId).textContent = value;
            }

            /* Watchdog: flip to offline as soon as polls stop succeeding, even
             * if the pending request hasn't rejected yet (a dropped link can
             * hang for a long time before fetch gives up). */
            setInterval(() => {
                if (lastOk && Date.now() - lastOk > STALE_AFTER_MS) setStale(true);
            }, 250);

            /* ---------- charts (canvas, no libraries) ---------- */
            /* The window is the station's, not the page's: `chart_range` names
             * the same three the knob cycles. Each is the tail of one of three
             * server-side rings (/api/history?p=): 5m = 1 s samples, 1h = 5 s
             * points, 1d = 1 min points. 1h and 24h cover the same stretch as
             * the panel; live is the whole 5 min ring here, its newest minute
             * there. */
            let range = null; /* 'live' | '1h' | '24h'; null until the first status */
            const RANGES = {
                live: { tier: "5m", len: 300 },
                "1h": { tier: "1h", len: 720 },
                "24h": { tier: "1d", len: 1440 },
            };
            const TIERS = {
                "5m": { refresh: 2 },
                "1h": { refresh: 10 },
                "1d": { refresh: 60 },
            };
            const hists = { "5m": null, "1h": null, "1d": null };
            const curTier = () => (range ? RANGES[range].tier : null);

            async function loadHistory(p) {
                try {
                    const r = await fetch("/api/history?p=" + p);
                    if (!r.ok) throw new Error(r.status);
                    hists[p] = await r.json();
                    if (p === curTier()) renderCharts();
                } catch (e) {}
            }

            let histTick = 0;
            setInterval(() => {
                histTick++;
                const tier = curTier();
                if (tier && histTick % TIERS[tier].refresh === 0)
                    loadHistory(tier);
            }, 1000);

            /* Tail of arr left-padded with nulls to exactly n points. A tier
             * longer than its window is clamped rather than throwing. */
            function padTo(arr, n) {
                const tail = (arr || []).slice(-n);
                return Array(Math.max(0, n - tail.length))
                    .fill(null)
                    .concat(tail);
            }

            /* ---------- the five measured series ----------
             * One entry drives the whole column: the card markup, the reading,
             * the min/max pair, the trend arrow and the chart under it. `src`
             * names the field in /api/status `climate`, `hist` the array in
             * /api/history, `dev` the device behind it, whose liveness the dot
             * in the card header shows. `span`/`trendFmt` fall back to `fmt`.
             * `scale: "log"` is for illuminance only — a linear axis over six
             * decades leaves everything below noon flat on the baseline. */
            const SERIES = [
                {
                    k: "t",
                    src: "temp",
                    dev: "tmp117",
                    hist: "temp",
                    title: "temperature",
                    unit: "°C",
                    color: "--temp",
                    fmt: (v) => v.toFixed(2),
                    span: (v) => v.toFixed(2) + "°",
                    /* what the other two thermometers on the board read: both
                     * sit elsewhere and neither feeds the chart, so they are a
                     * cross-check rather than a reading, each with its
                     * deviation from the TMP117 in brackets. */
                    footer: (cl, s) => {
                        const sn = s.sensors || {};
                        const ref = sn.tmp117 && sn.tmp117.ok ? sn.tmp117.temp : null;
                        const one = (name, d, f) => {
                            if (!d || !d.ok) return footKV(name, NA + "°");
                            const dev =
                                typeof ref === "number"
                                    ? " (" + num(d.temp - ref, (v) => (v < 0 ? "-" : "+") + f(Math.abs(v))) + ")"
                                    : "";
                            return footKV(name, num(d.temp, f) + "°" + dev);
                        };
                        return {
                            cls: "plain",
                            html:
                                one("SCD40", sn.scd40, (v) => v.toFixed(1)) +
                                "&nbsp;&nbsp;&nbsp;" +
                                one("BMP581", sn.bmp581, (v) => v.toFixed(2)),
                        };
                    },
                },
                {
                    k: "h",
                    src: "rh",
                    dev: "scd40",
                    hist: "rh",
                    title: "humidity",
                    unit: "%",
                    color: "--hum",
                    fmt: (v) => v.toFixed(1),
                    span: (v) => v.toFixed(1) + "%",
                    /* derived on the SCD40 from the same reading as the RH */
                    footer: (cl, s) => {
                        const d = (s.sensors || {}).scd40 || {};
                        return {
                            cls: "plain",
                            html: footKV(
                                t("sensDew"),
                                (d.ok ? num(d.dew, (v) => v.toFixed(1)) : NA) +
                                    "°",
                            ),
                        };
                    },
                },
                {
                    k: "c",
                    src: "co2",
                    dev: "scd40",
                    hist: "co2",
                    title: "co2",
                    unit: "ppm",
                    color: "--co2",
                    /* the line takes the color of the level it ends at */
                    colorOf: (v) => co2Level(v).color,
                    /* the level badge sits where the other cards put the
                     * trend arrow */
                    badge: (cl) =>
                        typeof cl.co2 === "number" ? co2Level(cl.co2) : null,
                    fmt: (v) => v.toFixed(0),
                },
                {
                    k: "p",
                    /* Sea level everywhere the pressure is read — that is the
                     * value comparable with a forecast and with the outside
                     * block. `hist` is already reduced by the endpoint, so the
                     * chart, the min/max and the trend follow along. */
                    src: "press_msl",
                    hist: "press",
                    dev: "bmp581",
                    title: "sensPress",
                    unit: "hPa",
                    color: "--press",
                    fmt: (v) => v.toFixed(3),
                    /* The tendency comes from the device, not from the chart
                     * window: three hours by definition, so it must not follow
                     * the live / 1 h / 24 h segment. The arrow repeats with the
                     * grade — one head slow, three rapid. */
                    badge: (cl, s) => trendBadge(s.zambretti),
                    /* the forecast wording, and on the right edge the pressure
                     * as measured — the card itself shows it reduced */
                    footer: (cl, s) => ({
                        html: s.zambretti
                            ? t("zcode")[s.zambretti.code]
                            : t("noTrend"),
                        cls: s.zambretti
                            ? trendBadge(s.zambretti).cls
                            : "pending",
                        right: num(cl.press, (v) => v.toFixed(3)) + " hPa",
                    }),
                },
                {
                    k: "l",
                    src: "lux",
                    dev: "veml7700",
                    hist: "lux",
                    title: "sensLux",
                    unit: "lx",
                    color: "--lux",
                    scale: "log",
                    fmt: fmtLux,
                    /* the white/lux ratio reads the light source, the gain and
                     * the integration time explain the reading it came from */
                    footer: (cl, s) => {
                        const d = (s.sensors || {}).veml7700 || {};
                        const gap = "&nbsp;&nbsp;&nbsp;";
                        return {
                            cls: "plain",
                            html:
                                footKV(
                                    t("sensWhiteRatio"),
                                    d.ok
                                        ? num(d.white_ratio, (v) => v.toFixed(2))
                                        : NA,
                                ) +
                                gap +
                                footKV(t("sensGain"), d.ok ? "×" + txt(d.gain) : NA) +
                                gap +
                                footKV(
                                    t("sensIt"),
                                    (d.ok ? num(d.it, String) : NA) + " " + t("uMs"),
                                ),
                        };
                    },
                },
            ];

            /* Data arrays for the current window; null = gap. `times` holds the unix
             * timestamp of every slot (uniform grid of `period` seconds). */
            function windowSeries() {
                const hd = range && hists[RANGES[range].tier];
                if (!hd) return null;
                const step = hd.period;
                const n = RANGES[range].len;
                const now = Math.floor(Date.now() / 1000 / step) * step;
                const out = {
                    times: Array.from(
                        { length: n },
                        (_, i) => now - (n - 1 - i) * step,
                    ),
                };
                SERIES.forEach((sr) => (out[sr.k] = padTo(hd[sr.hist], n)));
                /* Charted together on the presence card, but neither is a
                 * series: no trend, no card of its own. */
                out.o = padTo(hd.presence, n);
                out.oMotion = padTo(hd.motion, n);
                return out;
            }

            /* Cards are generated once and then only their text changes, so a
             * sensor that never reports still holds its place with NA. */
            function buildSensorCards() {
                const cards = SERIES.map((sr) => {
                    /* data-i18n on the badge is only the "no data" starting
                     * text; renderStatus() overwrites it right after
                     * applyLang() on every poll and on a language switch */
                    const head = sr.badge
                        ? `<span class="badge off" id="${sr.k}Badge" data-i18n="noData"></span>`
                        : `<span class="trend flat" id="${sr.k}Trend">—</span>`;
                    return (
                        '<div class="card sensor"><h2>' +
                        `<span class="sens-dot" id="${sr.k}Dot"></span>` +
                        `<span data-i18n="${sr.title}"></span>${head}` +
                        `<button class="on-panel" id="${sr.k}Panel" ` +
                        `data-q="${sr.hist}" data-i18n-title="onPanel">` +
                        /* flat monitor (Feather Icons, MIT) */
                        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" ' +
                        'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
                        'stroke-linejoin="round" aria-hidden="true">' +
                        '<rect x="2" y="3" width="20" height="14" rx="2"/>' +
                        '<path d="M8 21h8M12 17v4"/></svg></button></h2>' +
                        '<div class="reading">' +
                        `<span class="value" id="${sr.k}Val">${NA}</span>` +
                        `<span class="unit">${sr.unit}</span>` +
                        '<div class="minmax">' +
                        `<span><span data-i18n="max"></span> <b id="${sr.k}Max">${NA}</b></span>` +
                        `<span><span data-i18n="min"></span> <b id="${sr.k}Min">${NA}</b></span>` +
                        "</div></div>" +
                        `<canvas id="${sr.k}Chart"></canvas>` +
                        (sr.footer
                            ? `<div class="cardfoot pending" id="${sr.k}Foot">` +
                              `<span class="cf-l"></span><span class="cf-r"></span></div>`
                            : "") +
                        "</div>"
                    );
                });
                /* Last, after the climate: not a series — no live reading on
                 * `climate`, no trend — so it is written out rather than
                 * generated. Motion activity is the line, occupancy the
                 * columns under it; the share of the window spent occupied
                 * heads the card, and the live held state is its badge. */
                cards.push(
                    '<div class="card sensor"><h2>' +
                        '<span class="sens-dot" id="oDot"></span>' +
                        '<span data-i18n="presenceTitle"></span>' +
                        '<span class="badge off" id="oBadge" data-i18n="noData"></span></h2>' +
                        '<div class="reading">' +
                        `<span class="value" id="oVal">${NA}</span>` +
                        '<span class="unit">%</span>' +
                        '<div class="minmax">' +
                        `<span><span data-i18n="presenceMotion"></span> <b id="oMotion">${NA}</b></span>` +
                        "</div></div>" +
                        '<canvas id="oChart"></canvas></div>',
                );
                $("sensorCards").innerHTML = cards.join("");
            }
            buildSensorCards(); /* before charts: they look the canvases up */

            /* The card's value comes from the charted window (renderCharts);
             * live here are the held state as the badge and the bare line
             * beside it, which is what tells a dead sensor from a quiet room.
             * The sensor is a GPIO and cannot report itself absent, so the dot
             * is lit whenever the reply carried the object at all. */
            function renderPresence(pir) {
                setDot("oDot", !!pir);
                const b = $("oBadge");
                const busy = !!(pir && pir.presence);
                b.className = "badge " + (busy ? "good" : "off");
                b.textContent = !pir
                    ? t("noData")
                    : t(busy ? "presenceBusy" : "presenceEmpty");
                $("oMotion").textContent = !pir ? NA : t(pir.raw ? "yes" : "no");
            }

            /* One record per chart, keyed like SERIES; data/times/stroke are
             * refreshed by renderCharts(). */
            const charts = {};
            SERIES.forEach((sr) => {
