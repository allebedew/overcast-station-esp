                charts[sr.k] = {
                    canvas: $(sr.k + "Chart"),
                    unit: sr.unit,
                    fmt: sr.fmt,
                    scale: sr.scale,
                };
            });
            /* Presence is charted like a series without being one, and it is
             * two quantities: the line is the share of the slot that saw
             * motion, the columns under it the held occupancy. */
            charts.o = {
                canvas: $("oChart"),
                unit: "%",
                fmt: (v) => v.toFixed(0),
                barMax: 1,
            };
            const M = {
                l: 36,
                r: 6,
                t: 4,
                b: 15,
            }; /* chart margins for axis labels */

            /* Round tick step: 1/2/5 x 10^k covering roughly `raw` */
            function niceStep(raw) {
                const pow = Math.pow(10, Math.floor(Math.log10(raw)));
                const f = raw / pow;
                return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * pow;
            }

            const fmtTick = (ts) =>
                new Date(ts * 1000).toLocaleTimeString(locale(), {
                    hour: "2-digit",
                    minute: "2-digit",
                });

            function fmtTipTime(ts) {
                const d = new Date(ts * 1000);
                const opts = { hour: "2-digit", minute: "2-digit" };
                if (range !== "24h") opts.second = "2-digit";
                let s = d.toLocaleTimeString(locale(), opts);
                if (d.toDateString() !== new Date().toDateString()) {
                    s =
                        d.toLocaleDateString(locale(), {
                            day: "2-digit",
                            month: "2-digit",
                        }) +
                        " " +
                        s;
                }
                return s;
            }

            function draw(ch) {
                const { canvas, data, times } = ch;
                if (!data) return;
                const dpr = window.devicePixelRatio || 1;
                const w = canvas.clientWidth,
                    h = canvas.clientHeight;
                if (!w) return;
                /* Resizing the backing store clears and reallocates it, so it
                 * is only done when the size really changed — draw() runs on
                 * every pointermove. setTransform (not scale) because the
                 * transform now survives from the previous frame. */
                const bw = Math.round(w * dpr),
                    bh = Math.round(h * dpr);
                if (canvas.width !== bw || canvas.height !== bh) {
                    canvas.width = bw;
                    canvas.height = bh;
                }
                const ctx = canvas.getContext("2d");
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.clearRect(0, 0, w, h);
                ctx.font = "10px " + css("--font");

                const ph = h - M.t - M.b;

                /* Columns rising from the baseline, `barMax` filling the plot.
                 * Occupancy is a flag and makes a poor line; as a strip under
                 * the motion trace it reads as one picture. */
                function bars(x) {
                    if (!ch.bars) return;
                    const bw = Math.max(1, ((ch.pw || 0) / ch.bars.length) * 0.8);
                    ctx.fillStyle = ch.stroke + "2e";
                    ch.bars.forEach((v, i) => {
                        if (!v) return;
                        const bh = (Math.min(v, ch.barMax) / ch.barMax) * ph;
                        ctx.fillRect(x(i) - bw / 2, M.t + ph - bh, bw, bh);
                    });
                }

                const vals = data.filter((v) => v != null);
                if (vals.length < 2) {
                    ch.ml = M.l;
                    ch.pw = w - M.l - M.r;
                    bars((i) => M.l + (i / (data.length - 1)) * ch.pw);
                    ctx.fillStyle = css("--text-faint");
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(t(ch.empty || "chartNoData"), w / 2, h / 2);
                    return;
                }

                /* Everything below works in "axis space": identical to the
                 * value for a linear chart, its base-10 logarithm for a log
                 * one. Only the tick generator and y() know the difference. */
                const log = ch.scale === "log";
                const LOG_FLOOR = 0.01; /* darker than the sensor can tell */
                const ax = log
                    ? (v) => Math.log10(Math.max(v, LOG_FLOOR))
                    : (v) => v;

                const axv = vals.map(ax);
                const min = Math.min(...axv),
                    max = Math.max(...axv);
                const pad = (max - min) * 0.15 || (log ? 0.5 : 1);
                const lo = min - pad,
                    hi = max + pad;

                /* y axis: round-valued gridlines with labels on the left.
                 * Linear picks one round step; log walks 1/2/5 per decade and
                 * keeps whatever lands inside the window. */
                const yticks = [];
                let ydec = 0;
                if (log) {
                    /* Subdivide a decade only while there is room for it —
                     * over four decades even 1/2/5 would put 15 lines on a
                     * sparkline and reach the top before running out. */
                    const decades = hi - lo;
                    const mults =
                        decades <= 0.7
                            ? [1, 1.5, 2, 3, 5, 7]
                            : decades <= 2
                              ? [1, 2, 5]
                              : decades <= 4
                                ? [1, 5]
                                : [1];
                    /* never below the floor ax() clamps to, or the tick and
                     * the line it labels would sit at different values */
                    const k0 = Math.max(
                        Math.floor(lo),
                        Math.log10(LOG_FLOOR),
                    );
                    for (let k = k0; k <= Math.ceil(hi); k++) {
                        for (const m of mults) {
                            const v = m * Math.pow(10, k);
                            if (ax(v) >= lo && ax(v) <= hi) yticks.push(v);
                        }
                    }
                } else {
                    const ystep = niceStep((hi - lo) / 3);
                    /* Labels follow the step, not the value: a window a third
                     * of a degree wide needs both decimals, and a pressure one
                     * spanning hundredths of a hPa needs three. */
                    ydec = Math.max(
                        0,
                        Math.min(3, Math.ceil(-Math.log10(ystep))),
                    );
                    for (
                        let v = Math.ceil(lo / ystep) * ystep;
                        v <= hi + ystep * 0.01;
                        v += ystep
                    ) {
                        yticks.push(v);
                    }
                }
                /* Log ticks are 1/1.5/2/… x 10^k, so two significant digits
                 * name every one of them exactly, at any decade. */
                const ylabel = (v) =>
                    log
                        ? v >= 1000
                            ? v / 1000 + "k"
                            : String(Number(v.toPrecision(2)))
                        : v.toFixed(ydec);

                /* The left margin follows the widest label instead of being
                 * fixed: "1013.250" does not fit the 36 px that "23.4" needs,
                 * and a clipped axis label is worse than a narrower plot. */
                const labels = yticks.map(ylabel);
                const ml = Math.max(
                    M.l,
                    Math.max(0, ...labels.map((s) => ctx.measureText(s).width)) + 9,
                );
                const pw = w - ml - M.r;
                ch.pw = pw; /* used by the hover handler to map px -> index */
                ch.ml = ml;

                const x = (i) => ml + (i / (data.length - 1)) * pw;
                const y = (v) => M.t + ph - ((ax(v) - lo) / (hi - lo)) * ph;

                ctx.lineWidth = 1;
                ctx.fillStyle = css("--text-faint");
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                yticks.forEach((v, i) => {
                    const yy = y(v);
                    ctx.strokeStyle = "rgba(139,152,169,.12)";
                    ctx.beginPath();
                    ctx.moveTo(ml, yy);
                    ctx.lineTo(w - M.r, yy);
                    ctx.stroke();
                    ctx.fillText(labels[i], ml - 5, yy);
                });

                /* x axis: time labels aligned to a round step, <= 6 ticks */
                const tstep = times[1] - times[0];
                const span = times[times.length - 1] - times[0];
                const xsteps = [
                    60, 300, 600, 900, 1800, 3600, 7200, 14400, 21600, 43200,
                ];
                const xstep = xsteps.find((s) => span / s <= 6) || 86400;
                ctx.textAlign = "center";
                ctx.textBaseline = "top";
                for (
                    let tt = Math.ceil(times[0] / xstep) * xstep;
                    tt <= times[times.length - 1];
                    tt += xstep
                ) {
                    const xx = x((tt - times[0]) / tstep);
                    if (xx < ml + 14 || xx > w - 16)
                        continue; /* label would clip */
                    ctx.strokeStyle = "rgba(139,152,169,.08)";
                    ctx.beginPath();
                    ctx.moveTo(xx, M.t);
                    ctx.lineTo(xx, M.t + ph);
                    ctx.stroke();
                    ctx.fillStyle = css("--text-faint");
                    ctx.fillText(fmtTick(tt), xx, M.t + ph + 4);
                }

                bars(x);

                /* split into contiguous segments: nulls (offline periods) break the line */
                const segments = [];
                let seg = [];
                data.forEach((v, i) => {
                    if (v == null) {
                        if (seg.length) segments.push(seg);
                        seg = [];
                    } else seg.push([i, v]);
                });
                if (seg.length) segments.push(seg);

                const grad = ctx.createLinearGradient(0, M.t, 0, M.t + ph);
                grad.addColorStop(0, ch.stroke + "38");
                grad.addColorStop(1, ch.stroke + "00");

                for (const s of segments) {
                    if (s.length < 2) continue;
                    ctx.beginPath();
                    ctx.moveTo(x(s[0][0]), M.t + ph);
                    s.forEach(([i, v]) => ctx.lineTo(x(i), y(v)));
                    ctx.lineTo(x(s[s.length - 1][0]), M.t + ph);
                    ctx.closePath();
                    ctx.fillStyle = grad;
                    ctx.fill();

                    ctx.beginPath();
                    s.forEach(([i, v], j) =>
                        j ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v)),
                    );
                    ctx.strokeStyle = ch.stroke;
                    ctx.lineWidth = 1.8;
                    ctx.lineJoin = "round";
                    ctx.stroke();
                }

                /* last valid point */
                const last = segments[segments.length - 1];
                const [li, lv] = last[last.length - 1];
                ctx.beginPath();
                ctx.arc(x(li), y(lv), 3, 0, 2 * Math.PI);
                ctx.fillStyle = ch.stroke;
                ctx.fill();

                /* hover crosshair: the line alone over a slot with no value,
                 * which on the presence chart is an empty room rather than a
                 * gap in the recording */
                if (ch.hover != null) {
                    const hx = x(ch.hover);
                    ctx.strokeStyle = "rgba(139,152,169,.5)";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(hx, M.t);
                    ctx.lineTo(hx, M.t + ph);
                    ctx.stroke();
                    if (data[ch.hover] != null) {
                        ctx.beginPath();
                        ctx.arc(hx, y(data[ch.hover]), 3.5, 0, 2 * Math.PI);
                        ctx.fillStyle = ch.stroke;
                        ctx.fill();
                        ctx.strokeStyle = css("--bg");
                        ctx.stroke();
                    }
                }
            }

            /* ---------- chart hover: crosshair + tooltip ---------- */
            function chartHover(ch, ev) {
                if (!ch.data || !ch.pw) return;
                const rect = ch.canvas.getBoundingClientRect();
                let i = Math.round(
                    ((ev.clientX - rect.left - (ch.ml ?? M.l)) / ch.pw) *
                        (ch.data.length - 1),
                );
                i = Math.max(0, Math.min(ch.data.length - 1, i));
                /* A slot with bars but no value was recorded and has something
                 * to say ("nobody, 0 targets"), so it is not a gap to skip. */
                if (ch.data[i] == null && !(ch.bars && ch.bars[i] != null)) {
                    /* over a gap: snap to the nearest measured point */
                    let found = -1;
                    for (let d = 1; d < 30 && found < 0; d++) {
                        if (ch.data[i - d] != null) found = i - d;
                        else if (ch.data[i + d] != null) found = i + d;
                    }
                    if (found < 0) {
                        chartLeave(ch);
                        return;
                    }
                    i = found;
                }
                ch.hover = i;
                drawSoon(ch);

                const tip = $("tip");
                const v = ch.data[i];
                tip.innerHTML =
                    `<b>${v == null ? t(ch.empty || "chartNoData") : ch.fmt(v) + " " + ch.unit}</b>` +
                    (ch.bars
                        ? `<span>${t(ch.bars[i] ? "presenceOccupied" : "presenceEmpty")}</span>`
                        : "") +
                    `<span>${fmtTipTime(ch.times[i])}</span>`;
                tip.style.display = "block";
                let tx = ev.clientX + 14;
                if (tx + tip.offsetWidth > innerWidth - 8)
                    tx = ev.clientX - tip.offsetWidth - 14;
                tip.style.left = tx + "px";
                tip.style.top =
                    Math.max(8, ev.clientY - tip.offsetHeight - 12) + "px";
            }

            function chartLeave(ch) {
                ch.hover = null;
                drawSoon(ch);
                $("tip").style.display = "none";
            }

            /* Pointer events arrive far more often than the screen refreshes;
             * one redraw per frame per chart is enough. */
            function drawSoon(ch) {
                if (ch.raf) return;
                ch.raf = requestAnimationFrame(() => {
                    ch.raf = 0;
                    draw(ch);
                });
            }

            for (const k in charts) {
                const ch = charts[k];
                ch.canvas.addEventListener("pointermove", (ev) =>
                    chartHover(ch, ev),
                );
                ch.canvas.addEventListener("pointerdown", (ev) =>
                    chartHover(ch, ev),
                );
                ch.canvas.addEventListener("pointerleave", () =>
                    chartLeave(ch),
                );
            }

            function trendArrow(el, vals, fmt) {
                if (vals.length < 2) {
                    el.textContent = "—";
                    el.className = "trend flat";
                    return;
                }
                /* change across the whole displayed period: first sample of
                 * the window vs the latest one */
                const d = vals[vals.length - 1] - vals[0];
                const eps = (Math.max(...vals) - Math.min(...vals)) * 0.05;
                const f = fmt || ((v) => v.toFixed(1));
                el.textContent =
                    d > eps
                        ? "↑ " + f(Math.abs(d))
                        : d < -eps
                          ? "↓ " + f(Math.abs(d))
                          : "→";
                el.className =
                    "trend " + (d > eps ? "up" : d < -eps ? "down" : "flat");
            }

            function renderCharts() {
                const s = windowSeries();
                if (!s) return;
                SERIES.forEach((sr) => {
                    const ch = charts[sr.k];
                    const data = s[sr.k];
                    const vals = data.filter((v) => v != null);
                    /* min/max over the visible window, formatted like the
                     * card's own reading */
                    const span = sr.span || sr.fmt;
                    $(sr.k + "Min").textContent = vals.length
                        ? span(Math.min(...vals))
                        : NA;
                    $(sr.k + "Max").textContent = vals.length
                        ? span(Math.max(...vals))
                        : NA;
                    if (!sr.badge)
                        trendArrow(
                            $(sr.k + "Trend"),
                            vals,
                            sr.trendFmt || span,
                        );
                    ch.data = data;
                    ch.times = s.times;
                    ch.stroke =
                        sr.colorOf && vals.length
                            ? sr.colorOf(vals[vals.length - 1])
                            : css(sr.color);
                    draw(ch);
                });
                /* The card's headline value is the window's, not a reading:
                 * how much of it the room counted as occupied. */
                const occ = s.o.filter((v) => v != null);
                $("oVal").textContent = occ.length
                    ? String(
                          Math.round(
                              (100 * occ.reduce((a, v) => a + v, 0)) / occ.length,
                          ),
                      )
                    : NA;
                const och = charts.o;
                och.data = s.oMotion;
                och.bars = s.o;
                och.times = s.times;
                och.stroke = css("--presence");
                draw(och);
            }

            /* ---------- the panel's selection, shared both ways ----------
             * Both controls stand for a setting on the station, so a click is
             * posted and only comes back through /api/status. The local value
             * holds until that echo arrives -- otherwise the button would
             * spring back for the second the poll takes -- and after the window
             * runs out the station wins, whichever side moved it. */
            const ECHO_MS = 3000;
            const pending = {}; /* setting key -> {value, until} */
            let quantity = null; /* the series the panel plots; null until the first status */

            function setRange(v) {
                if (!RANGES[v] || v === range) return;
                range = v;
                document
                    .querySelectorAll("#rangeSeg button")
                    .forEach((b) => b.classList.toggle("active", b.dataset.r === v));
                renderCharts(); /* cached data first, if any */
                loadHistory(RANGES[v].tier);
            }

            function setQuantity(v) {
                quantity = v;
                document
                    .querySelectorAll(".on-panel")
                    .forEach((b) => b.classList.toggle("active", b.dataset.q === v));
            }

            function pick(key, value, apply) {
                pending[key] = { value, until: Date.now() + ECHO_MS };
                apply(value);
                saveSetting(key, value);
            }

            /* One selection out of a poll, unless a pick of ours is still
             * waiting for its echo. */
            function adopt(key, value, apply) {
                if (value === undefined) return;
                const p = pending[key];
                if (p && p.value !== value && Date.now() <= p.until) return;
                delete pending[key];
                apply(value);
            }

            $("rangeSeg").addEventListener("click", (e) => {
                const btn = e.target.closest("button");
                if (btn && btn.dataset.r !== range)
                    pick("chart_range", btn.dataset.r, setRange);
            });

            $("sensorCards").addEventListener("click", (e) => {
                const btn = e.target.closest(".on-panel");
                if (btn && btn.dataset.q !== quantity)
                    pick("chart_quantity", btn.dataset.q, setQuantity);
            });

            /* ---------- wifi: scan + connect ---------- */
            const rssiLevel = (r) =>
                r > -55 ? 4 : r > -67 ? 3 : r > -78 ? 2 : 1;
            const rssiIcon = (r) =>
                `<span class="rssi" data-l="${rssiLevel(r)}"><i></i><i></i><i></i><i></i></span>`;

            let scannedNets = [];
            let savedNets = [];

            $("scanBtn").addEventListener("click", async () => {
                const btn = $("scanBtn");
                btn.disabled = true;
                $("wifiList").innerHTML =
                    '<div class="scan-hint"><span class="spin"></span>' +
                    t("scanning") +
                    "</div>";
                try {
                    const r = await fetch("/api/scan");
                    if (!r.ok) throw new Error(r.status);
                    scannedNets = await r.json();
                } catch (e) {
                    toast(t("scanError"));
                }
                renderWifiList();
                btn.disabled = false;
            });

            let modalNet = null;
            function openWifiModal(n) {
                modalNet = n;
                $("mSsid").textContent = n.ssid;
                $("mMeta").textContent =
                    (n.auth === "open"
                        ? t("openNet")
                        : t("securedNet") + " (" + n.auth + ")") +
                    " · " +
                    n.rssi +
                    " dBm · " +
                    n.bssid;
                $("mPass").value = "";
                $("mPin").checked = true;
                $("mPass").style.display = n.auth === "open" ? "none" : "";
                $("wifiModal").classList.add("show");
                if (n.auth !== "open") setTimeout(() => $("mPass").focus(), 60);
            }
            $("mCancel").addEventListener("click", () =>
                $("wifiModal").classList.remove("show"),
            );
            $("wifiModal").addEventListener("click", (e) => {
                if (e.target === $("wifiModal"))
                    $("wifiModal").classList.remove("show");
            });
            $("mConnect").addEventListener("click", async () => {
                const btn = $("mConnect");
                btn.disabled = true;
                btn.textContent = t("saving");
                try {
                    const payload = {
                        ssid: modalNet.ssid,
                        password: $("mPass").value,
                    };
                    if ($("mPin").checked) payload.bssid = modalNet.bssid;
                    const r = await fetch("/api/networks", {
                        method: "POST",
                        body: JSON.stringify(payload),
                    });
                    if (!r.ok) throw new Error(await r.text());
                    $("wifiModal").classList.remove("show");
                    toast(t("netSaved") + modalNet.ssid + "…");
                    loadNets();
                    /* the reply may be lost if Wi-Fi switches right away - that's fine */
                    fetch("/api/connect", { method: "POST" }).catch(() => {});
                } catch (e) {
                    toast(t("netSaveFail") + e.message);
                }
                btn.disabled = false;
                btn.textContent = t("connect");
            });

            /* ---------- wifi: unified network list ---------- */
            const rssiOff =
                '<span class="rssi off"><i></i><i></i><i></i><i></i></span>';

            function connectedTo(ssid, bssid) {
                const sta = lastStatus && lastStatus.sta;
                if (!sta || !sta.connected || ssid !== sta.ssid) return false;
                if (bssid && sta.bssid)
                    return bssid.toLowerCase() === sta.bssid.toLowerCase();
                return true;
            }

            function renderWifiList() {
                const list = $("wifiList");
                const savedBy = new Map(savedNets.map((s) => [s.ssid, s]));
                const seen = new Set();
                const rows = [];
                scannedNets.forEach((n) => {
                    seen.add(n.ssid);
                    rows.push({
                        ssid: n.ssid,
                        bssid: n.bssid,
                        ch: n.ch,
                        rssi: n.rssi,
                        auth: n.auth,
                        inScan: true,
                        saved: savedBy.has(n.ssid),
                        connected: connectedTo(n.ssid, n.bssid),
                    });
                });
                savedNets.forEach((sv) => {
                    if (seen.has(sv.ssid)) return;
                    rows.push({
                        ssid: sv.ssid,
                        bssid: sv.bssid || null,
                        inScan: false,
                        saved: true,
                        connected: connectedTo(sv.ssid, sv.bssid),
                    });
                });
                if (!rows.length) {
                    list.innerHTML = `<div class="scan-hint">${t(
                        scannedNets.length ? "noNetsFound" : "noSavedNets",
                    )}</div>`;
                    return;
                }
                list.innerHTML = "";
                rows.forEach((row) => list.appendChild(wifiRow(row)));
            }

            function wifiRow(row) {
                const el = document.createElement("div");
                el.className = "wifi-item" + (row.connected ? " current" : "");
                const badges =
                    (row.connected
                        ? `<span class="wbadge conn">${t("connected")}</span>`
                        : "") +
                    (row.saved
                        ? `<span class="wbadge saved">${t("savedBadge")}</span>`
                        : "");
                const detail = row.inScan
                    ? `${esc(row.bssid)} · ch ${row.ch} · ${row.rssi} dBm · ${esc(
                          row.auth,
                      )}`
                    : (row.bssid ? esc(row.bssid) : t("byStrongest")) +
                      (scannedNets.length ? " · " + t("outOfRange") : "");
                const right =
                    (row.inScan && !row.connected && row.auth !== "open"
                        ? '<span class="lock">🔒</span>'
                        : "") +
                    (row.saved
                        ? `<span class="del" title="${t("delete")}">✕</span>`
                        : "");
                el.innerHTML = `${row.inScan ? rssiIcon(row.rssi) : rssiOff}
        <div class="wifi-text">
          <span class="ssid-line"><span class="ssid">${esc(
              row.ssid,
          )}</span>${badges}</span>
          <span class="bssid">${detail}</span>
        </div>
        ${right}`;
                if (row.saved) {
                    clickable(el.querySelector(".del"), (e) => {
                        e.stopPropagation();
                        delNet(row.ssid);
                    });
                }
                if (row.inScan) {
                    clickable(el, () =>
                        row.connected
                            ? toast(t("alreadyConn") + row.ssid)
                            : openWifiModal(row),
                    );
                } else {
                    el.style.cursor = "default";
                }
                return el;
            }

            async function loadNets() {
                try {
                    const r = await fetch("/api/networks");
                    savedNets = await r.json();
                } catch (e) {
                    savedNets = [];
                }
                renderWifiList();
            }

            async function delNet(ssid) {
                try {
                    const r = await fetch("/api/networks", {
                        method: "DELETE",
                        body: JSON.stringify({ ssid }),
                    });
                    if (!r.ok) throw new Error(await r.text());
                    toast(t("netRemoved") + ssid);
                } catch (e) {
                    toast(t("netSaveFail") + e.message);
                }
                loadNets();
            }

            $("reconnBtn").addEventListener("click", () => {
                toast(t("reconnecting"));
                fetch("/api/connect", { method: "POST" }).catch(() => {});
            });

            /* ---------- weather locations ---------- */
            const MAX_LOCS = 10;
            let locations = [];
            let activeLoc = -1;

            async function loadLocations() {
                try {
                    const r = await fetch("/api/locations");
                    const d = await r.json();
                    locations = d.locations || [];
                    activeLoc = d.active;
                } catch (e) {
                    locations = [];
                    activeLoc = -1;
                }
                renderLocBar();
            }

            function renderLocBar() {
                const bar = $("locBar");
                bar.innerHTML = "";
                locations.forEach((loc, i) => {
                    const chip = document.createElement("span");
                    chip.className = "loc-chip" + (i === activeLoc ? " active" : "");
                    chip.draggable = locations.length > 1;
                    chip.dataset.i = i;
                    chip.innerHTML =
                        `<span class="nm">${esc(loc.name)}</span>` +
                        (locations.length > 1
                            ? `<span class="del" title="${t("delete")}">✕</span>`
                            : "");
                    clickable(chip.querySelector(".nm"), () => selectLoc(i));
                    const del = chip.querySelector(".del");
                    if (del)
                        clickable(del, (e) => {
                            e.stopPropagation();
                            delLoc(i);
                        });
                    bar.appendChild(chip);
                });
                if (locations.length < MAX_LOCS) {
                    const add = document.createElement("span");
                    add.className = "loc-chip add";
                    add.textContent = "＋";
                    add.title = t("locAdd");
                    clickable(add, openLocModal);
                    bar.appendChild(add);
                }
            }

            /* Reordering the chips: HTML5 drag and drop, so it is mouse-only —
             * a touch screen keeps the order it was given. */
            let dragFrom = -1;
            $("locBar").addEventListener("dragstart", (e) => {
                const chip = e.target.closest(".loc-chip[draggable=true]");
                if (!chip) return;
                dragFrom = +chip.dataset.i;
                e.dataTransfer.effectAllowed = "move";
                /* Firefox starts no drag without payload */
                e.dataTransfer.setData("text/plain", String(dragFrom));
                chip.classList.add("dragging");
            });
            $("locBar").addEventListener("dragover", (e) => {
                if (dragFrom < 0) return;
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
                const chip = e.target.closest(".loc-chip[draggable=true]");
                $("locBar")
                    .querySelectorAll(".loc-chip.over")
                    .forEach((c) => c.classList.remove("over"));
                if (chip && +chip.dataset.i !== dragFrom) chip.classList.add("over");
            });
            $("locBar").addEventListener("drop", (e) => {
                const chip = e.target.closest(".loc-chip[draggable=true]");
                if (dragFrom < 0 || !chip) return;
                e.preventDefault();
                moveLoc(dragFrom, +chip.dataset.i);
            });
            $("locBar").addEventListener("dragend", () => {
                dragFrom = -1;
                $("locBar")
                    .querySelectorAll(".loc-chip")
                    .forEach((c) => c.classList.remove("dragging", "over"));
            });

            async function moveLoc(from, to) {
                if (from === to) return;
                /* Redraw from the local order at once: the round trip is long
                 * enough for the chip to visibly snap back otherwise. */
                const [moved] = locations.splice(from, 1);
                locations.splice(to, 0, moved);
                if (activeLoc === from) activeLoc = to;
                else if (from < activeLoc && activeLoc <= to) activeLoc--;
                else if (to <= activeLoc && activeLoc < from) activeLoc++;
                renderLocBar();
                try {
                    const r = await fetch("/api/locations/move", {
                        method: "POST",
                        body: JSON.stringify({ from, to }),
                    });
                    if (!r.ok) throw new Error(await r.text());
                } catch (e) {
                    toast(t("locAddFail") + e.message);
                    loadLocations();
                }
            }

            async function selectLoc(i) {
                if (i === activeLoc) return;
                activeLoc = i;
                renderLocBar();
                try {
                    await fetch("/api/locations/active", {
                        method: "PUT",
                        body: JSON.stringify({ index: i }),
                    });
                } catch (e) {}
                refresh(); /* card shows "waiting" until the refetch lands */
            }

            async function delLoc(i) {
                if (locations.length <= 1) {
                    toast(t("locLast"));
                    return;
                }
                if (!confirm(t("locDelConfirm").replace("{name}", locations[i].name)))
                    return;
                const name = locations[i].name;
                try {
                    const r = await fetch("/api/locations", {
                        method: "DELETE",
                        body: JSON.stringify({ index: i }),
                    });
                    if (!r.ok) throw new Error(await r.text());
                    toast(t("locRemoved").replace("{name}", name));
                } catch (e) {
                    toast(t("locAddFail") + e.message);
                }
                await loadLocations();
                refresh();
            }

            /* Geocoding (place name -> coordinates) runs in the browser, which
             * has internet; the device only stores the resolved coordinates.
             * A search hit fills the form rather than saving straight away, so
             * the same fields serve manual coordinates and a renamed city. */
            let locSearchTimer = null;
            function openLocModal() {
                ["locSearch", "locName", "locLat", "locLon"].forEach(
                    (id) => ($(id).value = ""),
                );
                $("locResults").innerHTML = "";
                $("locModal").classList.add("show");
                setTimeout(() => $("locSearch").focus(), 60);
            }
            $("locCancel").addEventListener("click", () =>
                $("locModal").classList.remove("show"),
            );
            $("locModal").addEventListener("click", (e) => {
                if (e.target === $("locModal"))
                    $("locModal").classList.remove("show");
            });
            $("locSearch").addEventListener("input", (e) => {
                const q = e.target.value.trim();
                clearTimeout(locSearchTimer);
                if (q.length < 2) {
                    $("locResults").innerHTML = "";
                    return;
                }
                locSearchTimer = setTimeout(() => geocode(q), 350);
            });

            async function geocode(q) {
                const res = $("locResults");
                res.innerHTML =
                    '<div class="scan-hint"><span class="spin"></span>' +
                    t("locSearching") +
                    "</div>";
                let data;
                try {
                    const url =
                        "https://geocoding-api.open-meteo.com/v1/search?count=8&format=json&language=" +
                        lang +
                        "&name=" +
                        encodeURIComponent(q);
                    const r = await fetch(url);
                    if (!r.ok) throw new Error(r.status);
                    data = await r.json();
                } catch (e) {
                    res.innerHTML = `<div class="scan-hint">${t("locSearchErr")}</div>`;
                    return;
                }
                const list = (data && data.results) || [];
                if (!list.length) {
                    res.innerHTML = `<div class="scan-hint">${t("locNoResults")}</div>`;
                    return;
                }
                res.innerHTML = "";
                list.forEach((g) => {
                    const place = [g.admin1, g.country].filter(Boolean).join(", ");
                    const el = document.createElement("div");
                    el.className = "loc-result";
                    el.innerHTML =
                        `<div>${esc(g.name)}</div>` +
                        `<div class="sub">${esc(place)} · ${g.latitude.toFixed(
                            2,
                        )}, ${g.longitude.toFixed(2)}</div>`;
                    clickable(el, () => fillLoc(g));
                    res.appendChild(el);
                });
            }

            function fillLoc(g) {
                $("locName").value = g.name.slice(0, 32);
                $("locLat").value = g.latitude.toFixed(4);
                $("locLon").value = g.longitude.toFixed(4);
                $("locName").focus();
            }

            $("locAdd").addEventListener("click", addLoc);
            $("locModal").addEventListener("keydown", (e) => {
                if (e.key !== "Enter") return;
                if (e.target.id === "locSearch") {
                    clearTimeout(locSearchTimer);
                    const q = e.target.value.trim();
                    if (q.length >= 2) geocode(q);
                    return;
                }
                addLoc();
            });

            async function addLoc() {
                const name = $("locName").value.trim();
                const lat = parseFloat($("locLat").value);
                const lon = parseFloat($("locLon").value);
                if (
                    !name ||
                    !isFinite(lat) ||
                    !isFinite(lon) ||
                    Math.abs(lat) > 90 ||
                    Math.abs(lon) > 180
                ) {
                    toast(t("locBadCoords"));
                    return;
                }
                try {
                    const r = await fetch("/api/locations", {
                        method: "POST",
                        body: JSON.stringify({ name, lat, lon }),
                    });
                    if (!r.ok) throw new Error(await r.text());
                } catch (e) {
                    toast(t("locAddFail") + e.message);
                    return;
                }
                $("locModal").classList.remove("show");
                toast(t("locAdded").replace("{name}", name));
                loadLocations();
            }

            /* ---------- settings ---------- */
            /* `msg` is optional: the chart controls are clicked often enough
               that a toast per click would be noise. */
            async function saveSetting(key, value, msg) {
                await fetch("/api/settings", {
                    method: "POST",
                    body: JSON.stringify({ [key]: value }),
                });
                if (msg) toast(t(msg));
            }

            /* Sliders report while dragging and save once let go: on `input`
               every pixel would be an NVS write on the station. */
            function wireSlider(id, valId, key, msg) {
                $(id).addEventListener(
                    "input",
                    (e) => ($(valId).textContent = e.target.value),
                );
                $(id).addEventListener("change", (e) =>
                    saveSetting(key, +e.target.value, msg),
                );
            }

            function wireCheckbox(id, key, msg) {
                $(id).addEventListener("change", (e) =>
                    saveSetting(key, e.target.checked, msg),
                );
            }

            wireSlider("briRange", "briVal", "led_brightness", "brightSaved");
            wireSlider("volRange", "volVal", "buzzer_volume", "settingSaved");
            wireSlider(
                "dispBriRange",
                "dispBriVal",
                "display_brightness",
                "settingSaved",
            );
            wireCheckbox("dispOn", "display_on", "settingSaved");
            wireCheckbox(
                "dispAutoBri",
                "display_auto_brightness",
                "settingSaved",
            );

            $("windUnitSel").addEventListener("change", (e) =>
                saveSetting("wind_unit", e.target.value, "settingSaved"),
            );

            /* Site altitude: the one input to the sea-level reduction. Saved on
               change (blur or Enter), so the field is not written back while it
               is being typed into. */
            $("altInput").addEventListener("change", async (e) => {
                const m = Math.round(+e.target.value);
                if (!Number.isFinite(m) || m < -500 || m > 9000) {
                    e.target.value = lastStatus?.settings?.altitude ?? 0;
                    return;
                }
                e.target.value = m;
                await fetch("/api/settings", {
                    method: "POST",
                    body: JSON.stringify({ altitude: m }),
                });
                toast(t("altSaved"));
            });

            $("frcBtn").addEventListener("click", async () => {
                const ppm = +$("frcPpm").value;
                if (!confirm(t("frcConfirm").replace("{ppm}", ppm))) return;
                const btn = $("frcBtn");
                btn.disabled = true;
                try {
                    const r = await fetch("/api/scd40/calibrate", {
                        method: "POST",
                        body: JSON.stringify({ ppm }),
                    });
                    if (!r.ok) throw new Error(await r.text());
                    toast(t("frcDone") + (await r.json()).correction + " ppm");
                } catch (e) {
                    toast(t("frcError") + e.message);
                } finally {
                    btn.disabled = false;
                }
            });

            $("histResetBtn").addEventListener("click", async () => {
                if (!confirm(t("histResetConfirm"))) return;
                const btn = $("histResetBtn");
                btn.disabled = true;
                try {
                    const r = await fetch("/api/history/reset", {
                        method: "POST",
                    });
                    if (!r.ok) throw new Error(await r.text());
                    toast(t("histResetDone"));
                    /* every tier is wiped on the device, so the cached ones
                     * must go too — otherwise switching the window would show
                     * history that no longer exists */
                    for (const p in hists) hists[p] = null;
                    if (range) loadHistory(RANGES[range].tier);
                } catch (e) {
                    toast(t("histResetError") + e.message);
                } finally {
                    btn.disabled = false;
                }
            });

            /* Escape closes whichever modal is open. */
            document.addEventListener("keydown", (e) => {
                if (e.key !== "Escape") return;
                document
                    .querySelectorAll(".overlay.show")
                    .forEach((o) => o.classList.remove("show"));
            });

            /* ---------- main loop ---------- */
            buildWeatherGrid(); /* before applyLang: it fills the labels */
            applyLang();
            refresh();
            setInterval(refresh, 1000);
            /* No loadHistory() here: which window to fetch comes from the first
               /api/status, and setRange() asks for it. */
            loadNets();
            loadLocations();
            /* a resize fires in bursts; one redraw per frame is enough */
            let resizeRaf = 0;
            window.addEventListener("resize", () => {
                cancelAnimationFrame(resizeRaf);
                resizeRaf = requestAnimationFrame(renderCharts);
            });
        </script>
    </body>
</html>
